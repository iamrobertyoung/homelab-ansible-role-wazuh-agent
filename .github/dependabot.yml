# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions updates
  # Keeps workflow actions up to date with security patches
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Majors get their own PR so a breaking update does not hold back minor and patch updates
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # Auto-label PRs for easier filtering
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    # Limit open PRs to avoid clutter
    open-pull-requests-limit: 5
    # Keep actions pinned to commit SHAs (security best practice)
    # Dependabot will update to new SHAs when versions change
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # Python/pip dependency updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      pip:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      pip-major:
        patterns:
          - "*"
        update-types:
          - "major"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
